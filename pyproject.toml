[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-bqnco"
version = "0.3.1"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "torch>=2.2,<3", "scipy>=1.11,<2"]

[project.optional-dependencies]
test = ["pytest>=7,<9"]
plot = ["matplotlib>=3.6,<4"]
gurobi = ["gurobipy>=12"]
entmax = ["entmax>=1.3"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["olsf_trs*", "bqnco_framework*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
